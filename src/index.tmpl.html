</head>
<body>

<!-- ===================== NAV ===================== -->

  <div class="nav-in">
    <a class="brandmark" href="#top"><img class="brandmark__logo" src="<!--{{base}}-->/assets/brand/logo.png" alt="Riverside Lifestyle"><span class="globe" role="img" aria-label="Weltweit"></span></a>

<!--{{navLinks}}-->

<!--{{langSwitch}}-->
      </span>

  </div>
</nav>

<!-- ===================== HERO: SPLIT THIRDS (PORTAL) ===================== -->
<header id="top" class="hero">
  <div class="<!--{{panelsClass}}-->">
<!--{{panels}}-->
  </div>

  <div class="hero-overlay">
    <span class="kicker"><!--{{heroKicker}}--></span>
    <h1><!--{{heroHeadline}}--></h1>
  </div>
</header>

<!-- ===================== WORLDWIDE ===================== -->
<section id="worldwide" class="worldwide">
  <div class="ww-head">
    <span class="kicker"><!--{{wwKicker}}--></span>
    <h2 class="ww-title"><!--{{wwTitle}}--></h2>
    <p class="ww-sub"><!--{{wwSub}}--></p>
  </div>
  <div class="ww-map">
    <img class="ww-map__base" src="<!--{{base}}-->/assets/world-map.svg" alt="" aria-hidden="true" loading="lazy">
    <svg class="ww-map__fx" viewBox="0 0 2000 1000" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <g class="ww-arcs">
      <path id="rw-arc0" class="ww-arc" pathLength="1" style="--i:0" d="M1053.6 236.4 Q821.2 96.6 588.9 273.9"/>
      <path id="rw-arc1" class="ww-arc" pathLength="1" style="--i:1" d="M1053.6 236.4 Q698.3 43.6 343.1 310.8"/>
      <path id="rw-arc2" class="ww-arc" pathLength="1" style="--i:2" d="M1053.6 236.4 Q1026.4 205.2 999.3 213.9"/>
      <path id="rw-arc3" class="ww-arc" pathLength="1" style="--i:3" d="M1053.6 236.4 Q1180.3 202.3 1307.1 360.0"/>
      <path id="rw-arc4" class="ww-arc" pathLength="1" style="--i:4" d="M1053.6 236.4 Q1414.8 39.1 1776.1 301.8"/>
      <path id="rw-arc5" class="ww-arc" pathLength="1" style="--i:5" d="M1053.6 236.4 Q1315.2 166.4 1576.8 492.5"/>
      <path id="rw-arc6" class="ww-arc" pathLength="1" style="--i:6" d="M1053.6 236.4 Q1446.8 232.3 1840.0 688.2"/>
      <path id="rw-arc7" class="ww-arc" pathLength="1" style="--i:7" d="M1053.6 236.4 Q897.3 262.5 740.9 630.8"/>
      <path id="rw-arc8" class="ww-arc" pathLength="1" style="--i:8" d="M1053.6 236.4 Q1077.9 307.8 1102.3 688.4"/>
      </g>
      <g class="ww-flows">
      <circle class="ww-flow" r="4"><animateMotion dur="3.4s" begin="0.00s" repeatCount="indefinite" rotate="auto"><mpath href="#rw-arc0"/></animateMotion></circle>
      <circle class="ww-flow" r="4"><animateMotion dur="4.0s" begin="0.45s" repeatCount="indefinite" rotate="auto"><mpath href="#rw-arc1"/></animateMotion></circle>
      <circle class="ww-flow" r="4"><animateMotion dur="4.6s" begin="0.90s" repeatCount="indefinite" rotate="auto"><mpath href="#rw-arc2"/></animateMotion></circle>
      <circle class="ww-flow" r="4"><animateMotion dur="5.2s" begin="1.35s" repeatCount="indefinite" rotate="auto"><mpath href="#rw-arc3"/></animateMotion></circle>
      <circle class="ww-flow" r="4"><animateMotion dur="3.4s" begin="1.80s" repeatCount="indefinite" rotate="auto"><mpath href="#rw-arc4"/></animateMotion></circle>
      <circle class="ww-flow" r="4"><animateMotion dur="4.0s" begin="2.25s" repeatCount="indefinite" rotate="auto"><mpath href="#rw-arc5"/></animateMotion></circle>
      <circle class="ww-flow" r="4"><animateMotion dur="4.6s" begin="2.70s" repeatCount="indefinite" rotate="auto"><mpath href="#rw-arc6"/></animateMotion></circle>
      <circle class="ww-flow" r="4"><animateMotion dur="5.2s" begin="3.15s" repeatCount="indefinite" rotate="auto"><mpath href="#rw-arc7"/></animateMotion></circle>
      <circle class="ww-flow" r="4"><animateMotion dur="3.4s" begin="3.60s" repeatCount="indefinite" rotate="auto"><mpath href="#rw-arc8"/></animateMotion></circle>
      </g>
      <g class="ww-pins">
      <g class="ww-pin" style="--d:0.00s" transform="translate(588.9,273.9)"><circle class="ww-pin__halo" r="5"/><circle class="ww-pin__dot" r="3.4"/></g>
      <g class="ww-pin" style="--d:0.25s" transform="translate(343.1,310.8)"><circle class="ww-pin__halo" r="5"/><circle class="ww-pin__dot" r="3.4"/></g>
      <g class="ww-pin" style="--d:0.50s" transform="translate(999.3,213.9)"><circle class="ww-pin__halo" r="5"/><circle class="ww-pin__dot" r="3.4"/></g>
      <g class="ww-pin" style="--d:0.75s" transform="translate(1307.1,360.0)"><circle class="ww-pin__halo" r="5"/><circle class="ww-pin__dot" r="3.4"/></g>
      <g class="ww-pin" style="--d:1.00s" transform="translate(1776.1,301.8)"><circle class="ww-pin__halo" r="5"/><circle class="ww-pin__dot" r="3.4"/></g>
      <g class="ww-pin" style="--d:1.25s" transform="translate(1576.8,492.5)"><circle class="ww-pin__halo" r="5"/><circle class="ww-pin__dot" r="3.4"/></g>
      <g class="ww-pin" style="--d:1.50s" transform="translate(1840.0,688.2)"><circle class="ww-pin__halo" r="5"/><circle class="ww-pin__dot" r="3.4"/></g>
      <g class="ww-pin" style="--d:1.75s" transform="translate(740.9,630.8)"><circle class="ww-pin__halo" r="5"/><circle class="ww-pin__dot" r="3.4"/></g>
      <g class="ww-pin" style="--d:2.00s" transform="translate(1102.3,688.4)"><circle class="ww-pin__halo" r="5"/><circle class="ww-pin__dot" r="3.4"/></g>
      <g class="ww-pin ww-pin--home" transform="translate(1053.6,236.4)"><circle class="ww-pin__ring" r="9"/><circle class="ww-pin__halo" r="7"/><circle class="ww-pin__dot" r="5"/></g>
      </g>
    </svg>
  </div>
  <h3 class="loc-title"><!--{{locationsTitle}}--></h3>
  <div class="loc-groups">
<!--{{locations}}-->
  </div>
</section>

<!-- ===================== KONTAKT ===================== -->
<section id="kontakt" class="contact">
  <div class="wrap">
    <div class="contact-head" data-reveal>
      <h2 class="contact-title"><!--{{contactTitle}}--></h2>
    </div>
    <div class="contact-grid">
      <!-- MAP -->
      <div class="contact-map" data-reveal>
        <iframe
          src="https://www.google.com/maps?q=Grenzstrasse+25,+9430+St.+Margrethen,+Schweiz&amp;output=embed"
          width="100%" height="100%" style="border:0" allowfullscreen="" loading="lazy"
          referrerpolicy="no-referrer-when-downgrade" title="Standort Riverside Lifestyle"></iframe>
      </div>

      <!-- CARD -->
      <div class="contact-card" data-reveal data-delay="1">
        <h3><!--{{siteName}}--></h3>
        <p class="contact-addr"><!--{{contactAddress}}--></p>

        <ul class="contact-list">
          <li>
            <span class="ci"><!--{{labelPhone}}--></span>
            <a href="tel:<!--{{phoneHref}}-->"><!--{{phone}}--></a>
          </li>
          <li>
            <span class="ci"><!--{{labelMail}}--></span>
            <a href="mailto:<!--{{mail}}-->"><!--{{mail}}--></a>
          </li>
        </ul>

        <div class="contact-social">
          <a href="<!--{{facebookUrl}}-->" target="_blank" rel="noopener" aria-label="Facebook">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5.02 3.66 9.18 8.44 9.94v-7.03H7.9v-2.9h2.54V9.85c0-2.51 1.49-3.9 3.78-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.78-1.63 1.57v1.88h2.78l-.44 2.9h-2.34V22c4.78-.76 8.43-4.92 8.43-9.94Z"/></svg>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
