name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Supplies base_path: empty on a custom domain, "/<repo>" on a project
      # page. Hardcoding either one breaks the other, and the breakage is
      # silent: the HTML looks correct, every stylesheet and link just 404s.
      - id: pages
        uses: actions/configure-pages@v5
      - name: Run tests
        run: node --test
      - name: Build
        run: node scripts/build.mjs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
